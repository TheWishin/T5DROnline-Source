# nftables rules for a relay-only node (install.sh --relay-only --firewall nft installs this as
# /etc/nftables.d/t5lobby.nft and includes it; or merge it into your own ruleset).
# Inbound: SSH, the relay's UDP 7781 (players and the central server's control requests), ICMP;
# everything else dropped. A relay node has no TCP port; the status port 7780 stays on loopback.
table inet t5lobby {
    set ssh_flood { type ipv4_addr; flags dynamic, timeout; timeout 1m; }

    chain input {
        type filter hook input priority filter; policy drop;
        ct state established,related accept
        ct state invalid drop
        iif "lo" accept
        meta l4proto { icmp, ipv6-icmp } limit rate 20/second accept

        tcp dport 22 ct state new add @ssh_flood { ip saddr limit rate over 10/minute } drop
        tcp dport 22 accept

        # UDP: players' pings and relayed game packets, the central server's control requests
        udp dport 7781 accept
    }
}
