# nftables rules for a lobby VPS that does not use ufw (install.sh --firewall nft installs this
# as /etc/nftables.d/t5lobby.nft and includes it; or merge it into your own ruleset).
# Inbound: SSH, the lobby's TCP 7781 and UDP 7781-7782, ICMP; everything else dropped.
# Port 80 is opened only while certbot renews (its hooks do that), the status port 7780 never.
table inet t5lobby {
    set ssh_flood { type ipv4_addr; flags dynamic, timeout; timeout 1m; }
    set lobby_flood { type ipv4_addr; flags dynamic, timeout; timeout 1m; }

    chain input {
        type filter hook input priority filter; policy drop;
        ct state established,related accept
        ct state invalid drop
        iif "lo" accept
        meta l4proto { icmp, ipv6-icmp } limit rate 20/second accept

        tcp dport 22 ct state new add @ssh_flood { ip saddr limit rate over 10/minute } drop
        tcp dport 22 accept

        # lobby control channel: at most 20 new connections per second per address
        # (the server's own per-address limits do the fine-grained work)
        tcp dport 7781 ct state new add @lobby_flood { ip saddr limit rate over 20/second } drop
        tcp dport 7781 accept
        # UDP: ping, registration, relay (7781) and NAT probe (7782)
        udp dport { 7781, 7782 } accept
    }
}
