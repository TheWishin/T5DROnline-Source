# Release: build the player zip and publish it as a GitHub Release.
#
#   git tag -a v0.1.0-preview -m "T5DR Online 0.1.0-preview" && git push origin v0.1.0-preview
#
# A pushed tag vMAJOR.MINOR.PATCH[-suffix] on a commit of main:
#   build    (windows-latest, read-only token) builds the zip exactly as
#            tools/package_release.py --release does on a developer PC, scans it
#            for game data, unpacks and smoke-tests it, and keeps zip + SHA256SUMS
#            + release notes as a workflow artifact;
#   publish  (environment "release") creates the GitHub Release from that
#            artifact in the PUBLIC repository (TheWishin/T5DROnline, README +
#            releases only), with the token in the secret PUBLIC_RELEASE_TOKEN.
#            This repository (T5DROnline-Dev) is private. A suffix (-preview,
#            -rc1, ...) makes it a pre-release. Release notes = the tag's section
#            of CHANGELOG.md.
#
# Dry runs build and check everything and publish nothing: "Run workflow" on the
# Actions tab, or any push to a branch that changes the release tooling (the
# paths below). Only the repository owner may push release tags or start runs
# by hand. See docs/RELEASING.md (also: re-running, yanking a bad release).
#
# Code signing (docs/RELEASING.md "Code signing") is built in and OFF until the owner adds the
# secrets of a signing service (SignPath Foundation, or Azure Artifact Signing). Without them the
# "Code signing" steps are skipped and the run is the same as before. With them, tag runs sign
# T5DR Online.exe and runtime/t5dr.exe before the zip is made; dry runs do not, unless started by
# hand with "sign" ticked.
#
# The launcher stub T5DR Online.exe is built with MSVC (cl.exe + link.exe). The repository
# variable T5DR_STUB_COMPILER=clang (or the "stub_compiler" input of a manual run) switches it to clang-cl.
name: Release

on:
  push:
    tags: ["v*"]
    # Path filters apply to branch pushes only; a tag push always runs.
    branches: ["**"]
    paths:
      - .github/workflows/release.yml
      - tools/package_release.py
      - tools/fetch_llvm.py
      - tools/release_notes.py
      - tools/smoke_release.py
      - tools/release-requirements.txt
      - tools/code_signing.py
      - launcher/stub/*
  workflow_dispatch:
    inputs:
      version:
        description: "Version stamped into the test zip, without v (empty: 0.0.0-dryrun.<run number>). Never publishes."
        required: false
        default: ""
        type: string
      sign:
        description: "Sign this test build too (needs the signing secrets; SignPath then waits for your approval). Never publishes."
        required: false
        default: false
        type: boolean
      stub_compiler:
        description: "What builds T5DR Online.exe: default = the variable T5DR_STUB_COMPILER, else msvc."
        required: false
        default: default
        type: choice
        options: [default, msvc, clang]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  # The CPython the zip ships in python/ (copied from this interpreter). 3.12.10
  # is the last 3.12 with python.org Windows binaries; the dev PC has the same.
  PYTHON_VERSION: "3.12.10"
  # msvc (default) or clang: what builds T5DR Online.exe (tools/package_release.py --stub-compiler).
  # An empty value means msvc.
  T5DR_STUB_COMPILER: ${{ (inputs.stub_compiler && inputs.stub_compiler != 'default') && inputs.stub_compiler || vars.T5DR_STUB_COMPILER }}

jobs:
  build:
    name: Build and check the player zip
    runs-on: windows-latest
    timeout-minutes: 75
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
      publish: ${{ steps.ver.outputs.publish }}
    steps:
      # The owner pushes tags with their own credentials, so this cannot tell the
      # owner from a tool using those credentials -- the "release" environment's
      # required reviewer (the publish job) is what guarantees a human approval.
      # It does stop anyone else with write access, and re-runs started by others.
      - name: Only the repository owner releases
        if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
        shell: bash
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$ACTOR" != "$OWNER" ] || [ "$TRIGGERING_ACTOR" != "$OWNER" ]; then
            echo "::error::Only $OWNER makes releases (actor: $ACTOR, started by: $TRIGGERING_ACTOR)."
            exit 1
          fi
          echo "started by $ACTOR (owner)"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # the tag must be on main: needs origin/main's history

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Version
        id: ver
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = push ] && [ "$REF_TYPE" = tag ]; then
            tag="$REF_NAME"
            publish=true
          else
            tag="v${INPUT_VERSION#v}"
            [ "$tag" = v ] && tag="v0.0.0-dryrun.$RUN_NUMBER"
            publish=false
          fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::'$tag' is not vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-suffix (v0.1.0, v0.1.0-preview)."
            exit 1
          fi
          if [ "$publish" = true ] && ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Tag '$tag' points at $(git rev-parse --short HEAD), which is not on main. Releases are cut from main."
            exit 1
          fi
          version="${tag#v}"
          case "$version" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          {
            echo "version=$version"; echo "tag=$tag"; echo "prerelease=$prerelease"; echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "NOTES_FLAGS=$([ "$publish" = true ] || echo --allow-missing)" >> "$GITHUB_ENV"
          echo "version $version, tag $tag, pre-release $prerelease, publish $publish ($(git rev-parse --short HEAD))"

      # Fails in seconds when the tag has no CHANGELOG.md section (dry runs: warning only).
      - name: Release notes exist (CHANGELOG.md)
        shell: bash
        run: python tools/release_notes.py --version "$VERSION" --check ${NOTES_FLAGS:+"$NOTES_FLAGS"}

      - name: Guard -- tracked files
        run: python tools/check_no_game_data.py

      - name: Python packages for the bundled Python (pinned, hash-checked)
        run: python -m pip install --disable-pip-version-check --require-hashes --only-binary ":all:" -r tools/release-requirements.txt

      # The LLVM the zip ships (toolchain/llvm) and compiles the runtime with:
      # pinned version + SHA-256 in tools/fetch_llvm.py.
      - name: LLVM (pinned, checksum-verified)
        run: python tools/fetch_llvm.py --dest "$env:RUNNER_TEMP/llvm"

      # The MSVC headers/libs and the Windows SDK the runtime host compiles against.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Toolchain
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress }
          & "$env:RUNNER_TEMP/llvm/bin/clang-cl.exe" --version
          ninja --version
          cmake --version

      # Fails naming the first patch that does not apply on the pin.
      - name: ps3recomp at the pin + patch series
        run: python tools/prepare_ps3recomp.py --dest deps/ps3recomp

      # Code signing: which service, if any. Looks only at whether the secrets exist; the values are
      # not printed. Needs: SignPath = SIGNPATH_API_TOKEN (secret) + SIGNPATH_ORGANIZATION_ID,
      # SIGNPATH_PROJECT_SLUG, SIGNPATH_SIGNING_POLICY_SLUG; Azure = AZURE_CLIENT_SECRET (secret) +
      # AZURE_TENANT_ID, AZURE_CLIENT_ID, ARTIFACT_SIGNING_ENDPOINT, ARTIFACT_SIGNING_ACCOUNT,
      # ARTIFACT_SIGNING_PROFILE. Everything but the two secrets may be a repository variable instead.
      # The variable SIGNING_PROVIDER (signpath, azure or none) overrides the automatic choice.
      - name: Code signing -- which service?
        id: signing
        shell: bash
        env:
          SIGN_THIS_RUN: ${{ (steps.ver.outputs.publish == 'true' || inputs.sign) && 'true' || 'false' }}
          WANT: ${{ vars.SIGNING_PROVIDER }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID || vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ secrets.SIGNPATH_PROJECT_SLUG || vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG || vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID || vars.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID || vars.AZURE_CLIENT_ID }}
          ARTIFACT_SIGNING_ENDPOINT: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT || vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT || vars.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ secrets.ARTIFACT_SIGNING_PROFILE || vars.ARTIFACT_SIGNING_PROFILE }}
        run: |
          set -euo pipefail
          provider=none
          if [ "$SIGN_THIS_RUN" = true ]; then
            want="${WANT:-auto}"
            case "$want" in auto|signpath|azure|none) ;; *) echo "::error::SIGNING_PROVIDER must be signpath, azure or none (it is '$want')."; exit 1 ;; esac
            if [ "$want" = signpath ] || { [ "$want" = auto ] && [ -n "$SIGNPATH_API_TOKEN" ]; }; then
              provider=signpath
            elif [ "$want" = azure ] || { [ "$want" = auto ] && [ -n "$AZURE_CLIENT_SECRET" ]; }; then
              provider=azure
            fi
            missing=""
            if [ "$provider" = signpath ]; then
              for v in SIGNPATH_API_TOKEN SIGNPATH_ORGANIZATION_ID SIGNPATH_PROJECT_SLUG SIGNPATH_SIGNING_POLICY_SLUG; do
                [ -n "${!v}" ] || missing="$missing $v"
              done
            elif [ "$provider" = azure ]; then
              for v in AZURE_CLIENT_SECRET AZURE_TENANT_ID AZURE_CLIENT_ID ARTIFACT_SIGNING_ENDPOINT ARTIFACT_SIGNING_ACCOUNT ARTIFACT_SIGNING_PROFILE; do
                [ -n "${!v}" ] || missing="$missing $v"
              done
            fi
            if [ -n "$missing" ]; then
              echo "::error::Code signing with $provider is set up only in part; missing:$missing (docs/RELEASING.md, Code signing). Add them, or set the variable SIGNING_PROVIDER to none."
              exit 1
            fi
          fi
          echo "provider=$provider" >> "$GITHUB_OUTPUT"
          case "$provider" in
            none) echo "code signing: off (this run is not signed, or no signing service is set up)" ;;
            *) echo "code signing: $provider" ;;
          esac

      - name: Package (tools/package_release.py --release)
        if: steps.signing.outputs.provider == 'none'
        run: python tools/package_release.py --release --version $env:VERSION --llvm "$env:RUNNER_TEMP/llvm" --ps3recomp deps/ps3recomp --out dist

      # Signing in the middle of packaging: the first half builds everything and puts the programs to
      # sign in dist/to-sign; the service signs them into dist/signed; the second half checks that each
      # is the built file plus a valid signature, installs it and makes the zip.
      - name: Package, first half (code signing)
        if: steps.signing.outputs.provider != 'none'
        run: python tools/package_release.py --release --version $env:VERSION --llvm "$env:RUNNER_TEMP/llvm" --ps3recomp deps/ps3recomp --out dist --sign-stage prepare

      # SignPath (free for open source: SignPath Foundation). The owner approves each release in
      # SignPath's web page (they send an e-mail); this step waits up to 20 minutes for it (a Windows runner minute counts double in a private repository).
      - name: Upload the unsigned programs (SignPath reads them from here)
        id: unsigned
        if: steps.signing.outputs.provider == 'signpath'
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-programs
          path: dist/to-sign
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      - name: Sign with SignPath
        if: steps.signing.outputs.provider == 'signpath'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID || vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG || vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG || vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ secrets.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG || vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1200
          output-artifact-directory: dist/signed

      # Azure Artifact Signing (formerly Trusted Signing): signs the files of a folder in place.
      - name: Copy the programs to sign (Azure signs in place)
        if: steps.signing.outputs.provider == 'azure'
        run: Copy-Item dist/to-sign dist/signed -Recurse

      - name: Sign with Azure Artifact Signing
        if: steps.signing.outputs.provider == 'azure'
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID || vars.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID || vars.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT || vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT || vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.ARTIFACT_SIGNING_PROFILE || vars.ARTIFACT_SIGNING_PROFILE }}
          files-folder: dist/signed
          files-folder-filter: exe,dll
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Package, second half (install the signed programs, make the zip)
        if: steps.signing.outputs.provider != 'none'
        run: python tools/package_release.py --release --version $env:VERSION --llvm "$env:RUNNER_TEMP/llvm" --ps3recomp deps/ps3recomp --out dist --sign-stage finish --signed-dir dist/signed

      - name: Guard -- the zip (game files, lifted code, keys)
        run: python tools/package_release.py --scan-only "dist/T5DR-Online-$env:VERSION.zip"

      - name: Checksums
        shell: bash
        working-directory: dist
        run: |
          cat SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Smoke test -- unpacked zip, bare PATH
        run: python tools/smoke_release.py "dist/T5DR-Online-$env:VERSION.zip" --version $env:VERSION --work "$env:RUNNER_TEMP/smoke" --no-gui

      # Starts the launcher (offscreen, then through T5DR Online.exe). Whether a
      # hosted runner's desktop session can show Tk windows is not guaranteed,
      # so this one only warns. Approve the release after trying the artifact.
      - name: Smoke test -- launcher (informational)
        continue-on-error: true
        timeout-minutes: 8
        run: python tools/smoke_release.py "dist/T5DR-Online-$env:VERSION.zip" --version $env:VERSION --work "$env:RUNNER_TEMP/smoke-gui"

      - name: Release notes
        shell: bash
        run: |
          set -euo pipefail
          # --repo "": no links into this private repository in the public notes
          python tools/release_notes.py --version "$VERSION" ${NOTES_FLAGS:+"$NOTES_FLAGS"} --repo "" \
            --release-json "dist/T5DR-Online-$VERSION/release.json" --sums dist/SHA256SUMS --out dist/RELEASE_NOTES.md
          {
            echo "## T5DR Online $VERSION"
            echo
            echo "| zip | size | SHA-256 |"
            echo "|---|---|---|"
            echo "| \`T5DR-Online-$VERSION.zip\` | $(( $(stat -c %s "dist/T5DR-Online-$VERSION.zip") / 1000000 )) MB | \`$(cut -d' ' -f1 dist/SHA256SUMS)\` |"
            echo
            echo "<details><summary>Release notes</summary>"
            echo
            cat dist/RELEASE_NOTES.md
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: T5DR-Online-${{ steps.ver.outputs.version }}
          path: |
            dist/T5DR-Online-${{ steps.ver.outputs.version }}.zip
            dist/SHA256SUMS
            dist/RELEASE_NOTES.md
          if-no-files-found: error
          compression-level: 0     # the zip is compressed already
          retention-days: 30

  publish:
    name: Publish the GitHub Release
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Deployments limited to tags v*; a required reviewer is optional (docs/RELEASING.md).
    environment:
      name: release
      url: https://github.com/${{ vars.PUBLIC_REPO || 'TheWishin/T5DROnline' }}/releases/tag/${{ needs.build.outputs.tag }}
    permissions:
      contents: read
    env:
      # A fine-grained token of the owner: only the public repository, Contents read/write.
      GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
      GH_REPO: ${{ vars.PUBLIC_REPO || 'TheWishin/T5DROnline' }}
      TAG: ${{ needs.build.outputs.tag }}
      VERSION: ${{ needs.build.outputs.version }}
      PRERELEASE: ${{ needs.build.outputs.prerelease }}
    steps:
      - name: Only the repository owner releases
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$ACTOR" != "$OWNER" ] || [ "$TRIGGERING_ACTOR" != "$OWNER" ]; then
            echo "::error::Only $OWNER makes releases (actor: $ACTOR, started by: $TRIGGERING_ACTOR)."
            exit 1
          fi

      - name: Token for the public repository
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The secret PUBLIC_RELEASE_TOKEN is missing (docs/RELEASING.md, one-time setup). The zip is kept as this run's artifact; add the secret and re-run this job."
            exit 1
          fi
          gh api "repos/$GH_REPO" --jq .full_name

      - uses: actions/download-artifact@v8
        with:
          name: T5DR-Online-${{ needs.build.outputs.version }}
          path: dist

      - name: Checksums
        working-directory: dist
        run: sha256sum -c SHA256SUMS

      # Idempotent, so "Re-run failed jobs" finishes a half-done publish. A published
      # release's zip is never replaced by a different one: yank it first.
      - name: Create the release (or finish a partial one)
        working-directory: dist
        run: |
          set -euo pipefail
          zip="T5DR-Online-$VERSION.zip"
          title="T5DR Online $VERSION"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # A DRAFT in the public repository: only the owner sees it. The owner downloads the zip,
            # checks it on VirusTotal and clicks "Publish release" (docs/RELEASING.md). The tag is
            # made on publishing, on the public main (the README commit), so the release's
            # "Source code" archives hold the README only.
            gh release create "$TAG" "$zip" SHA256SUMS --draft --target main --title "$title" \
              --notes-file RELEASE_NOTES.md --prerelease="$PRERELEASE"
          else
            draft=$(gh release view "$TAG" --json isDraft --jq .isDraft)
            has_zip=$(gh release view "$TAG" --json assets --jq "[.assets[] | select(.name == \"$zip\")] | length > 0")
            if [ "$draft" = false ] && [ "$has_zip" = true ]; then
              gh release download "$TAG" --pattern "$zip" --output published.zip
              if [ "$(sha256sum < published.zip | cut -d' ' -f1)" != "$(cut -d' ' -f1 SHA256SUMS)" ]; then
                echo "::error::$TAG is already published with a different $zip. Yank it first (docs/RELEASING.md) or release a new version."
                exit 1
              fi
              echo "$TAG already has this exact zip; refreshing notes and SHA256SUMS only"
              gh release upload "$TAG" SHA256SUMS --clobber
            else
              gh release upload "$TAG" "$zip" SHA256SUMS --clobber
            fi
            gh release edit "$TAG" --title "$title" --notes-file RELEASE_NOTES.md --prerelease="$PRERELEASE"
          fi
          gh release view "$TAG" --json url,isDraft,isPrerelease,assets --jq '"\(.url) draft=\(.isDraft) prerelease=\(.isPrerelease) assets=\([.assets[].name])"'
          {
            echo "## $TAG is a draft"
            echo
            echo "Download $zip from the draft on the public repository's Releases page, check it on"
            echo "VirusTotal, then click **Publish release**. Nothing is public before that."
          } >> "$GITHUB_STEP_SUMMARY"
