# Optional systemd drop-in for the TLS lobby's TCP 443 fallback (docs/DEPLOY_1.2.0.md).
# Install as /etc/systemd/system/t5lobby.service.d/tcp443.conf, then daemon-reload.
# Set T5L_TCP_FALLBACK_PORT=443 in /etc/t5lobby/t5lobby.env with the existing TLS certificate.
# Do not install on relay-only nodes. User=t5lobby and the base unit's hardening stay in force.
[Service]
CapabilityBoundingSet=CAP_NET_BIND_SERVICE
AmbientCapabilities=CAP_NET_BIND_SERVICE
